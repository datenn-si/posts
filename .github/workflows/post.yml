name: Notify blog

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    name: Start blog update
    runs-on: ubuntu-latest
    steps:
      # shortcut: a push payload contains at most 20 commits. An older post commit in a longer push is ignored.
      - name: Choose the posts SHA
        id: sha
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          sha=$(printf '%s' "$COMMITS" | jq -r '
            (if type == "array" then . else [] end)
            | map(select(.message != null))
            | map(select(.message | split("\n")[0] | startswith("post:")))
            | last
            | .id // empty
          ')
          if [ -z "$sha" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Refusing to dispatch an unexpected SHA"
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Start the blog update workflow
        if: steps.sha.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          gh workflow run update-posts.yml \
            --repo datenn-si/blog \
            --ref main \
            --raw-field "sha=${SHA}"
